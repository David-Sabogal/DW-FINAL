# render.yaml
databases:
  - name: papel-y-luna-db
    plan: free

services:
  - type: web
    name: papel-y-luna-backend
    runtime: node
    plan: free
    buildCommand: "npm install && cd papel-y-luna && npm install && npx sequelize-cli db:migrate"
    startCommand: "cd papel-y-luna && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: papel-y-luna-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true